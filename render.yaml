services:
  - type: web
    name: student-query-chatbot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://replace-with-vercel-project.vercel.app
      - key: CONFIDENCE_THRESHOLD
        value: "0.065"
